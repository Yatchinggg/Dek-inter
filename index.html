<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Team Logic - Thai Consonant Drill</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f2f5;
}

h1 {
    margin-top: 20px;
}

#hearts {
    font-size: 28px;
    color: red;
    margin: 10px;
}

#question {
    font-size: 26px;
    margin: 20px;
}

button {
    font-size: 22px;
    padding: 10px 15px;
    margin: 8px;
    cursor: pointer;
}

#result {
    margin-top: 15px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Team Logic - Thai Consonant Drill</h1>

<div id="hearts">❤️❤️❤️</div>
<div id="nickname-display" style="font-size:24px; font-weight:bold; margin-top:10px;"></div>
<div id="question">Press Start</div>
<div id="options"></div>
<div id="result"></div>
<!-- nickname input field -->
<input type="text" id="nickname" placeholder="Enter nickname" style="font-size:20px;padding:8px;" />
<button onclick="startGame()">Start</button>

<script>

sync function startQuiz() {

    const nickname = document.getElementById("nickname").value;

    const response = await fetch(
    "https://yatchinggg.github.io/Dek-inter/",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nickname: nickname
            })
        }
    );

    const data = await response.json();

    document.getElementById("user").innerText =
        nickname + " (" + data.counter + ")"
        startGame(); 
}



// 44 Thai consonants
const consonants = [
{char:"ก", name:"ko kai"},
{char:"ข", name:"kho khai"},
{char:"ฃ", name:"kho khuat"},
{char:"ค", name:"kho khwai"},
{char:"ฅ", name:"kho khon"},
{char:"ฆ", name:"kho rakhang"},
{char:"ง", name:"ngo ngu"},
{char:"จ", name:"cho chan"},
{char:"ฉ", name:"cho ching"},
{char:"ช", name:"cho chang"},
{char:"ซ", name:"so so"},
{char:"ฌ", name:"cho choe"},
{char:"ญ", name:"yo ying"},
{char:"ฎ", name:"do chada"},
{char:"ฏ", name:"to patak"},
{char:"ฐ", name:"tho than"},
{char:"ฑ", name:"tho nangmontho"},
{char:"ฒ", name:"tho phuthao"},
{char:"ณ", name:"no nen"},
{char:"ด", name:"do dek"},
{char:"ต", name:"to tao"},
{char:"ถ", name:"tho thung"},
{char:"ท", name:"tho thahan"},
{char:"ธ", name:"tho thong"},
{char:"น", name:"no nu"},
{char:"บ", name:"bo baimai"},
{char:"ป", name:"po pla"},
{char:"ผ", name:"pho phueng"},
{char:"ฝ", name:"fo fa"},
{char:"พ", name:"pho phan"},
{char:"ฟ", name:"fo fan"},
{char:"ภ", name:"pho samphao"},
{char:"ม", name:"mo ma"},
{char:"ย", name:"yo yak"},
{char:"ร", name:"ro ruea"},
{char:"ล", name:"lo ling"},
{char:"ว", name:"wo waen"},
{char:"ศ", name:"so sala"},
{char:"ษ", name:"so rusi"},
{char:"ส", name:"so suea"},
{char:"ห", name:"ho hip"},
{char:"ฬ", name:"lo chula"},
{char:"อ", name:"o ang"},
{char:"ฮ", name:"ho nokhuk"}
];

let hearts = 3;
let current = null;

// 随机函数
function getRandomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

// 打乱数组（Fisher-Yates）
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startGame() {
    hearts = 3;
    updateHearts();
    // show nickname if provided
    const nick = document.getElementById('nickname').value.trim();
    document.getElementById('nickname-display').innerText = nick ? `Player: ${nick}` : '';
    nextQuestion();
}

function updateHearts() {
    document.getElementById("hearts").innerText = "❤️".repeat(hearts);
}

function nextQuestion() {
    document.getElementById("result").innerText = "";

    current = getRandomItem(consonants);
    document.getElementById("question").innerText = current.name;

    let options = [];

    // 添加正确答案
    options.push(current);

    // 添加3个随机错误答案
    while (options.length < 4) {
        let random = getRandomItem(consonants);
        if (!options.includes(random)) {
            options.push(random);
        }
    }

    // 真正随机打乱
    shuffle(options);

    // 显示按钮
    let optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    options.forEach(item => {
        let btn = document.createElement("button");
        btn.innerText = item.char;
        btn.onclick = () => checkAnswer(item);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selected) {
    if (selected === current) {
        document.getElementById("result").innerText =
            "Correct! " + current.char + " = " + current.name;
        setTimeout(nextQuestion, 800);
    } else {
        hearts--;
        updateHearts();
        document.getElementById("result").innerText = "Wrong!";
        if (hearts === 0) {
            document.getElementById("question").innerText = "Game Over";
            document.getElementById("options").innerHTML = "";
        }
    }
}

</script>

</body>
</html>
